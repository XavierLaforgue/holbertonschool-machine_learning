readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "black>=26.5.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pycodestyle>=2.14.0",
    "pydocstyle>=6.3.0",
    "pylint>=4.0.7",
    "pyright>=1.1.411",
    "scikit-learn>=1.9.0",
]
